name: Publish release parent

# Publishes org.cadenzaflow:cadenzaflow-bpm-release-parent to Maven Central. Every module
# of the platform inherits from it. Its sources are in the repository
# cadenzaflow/cadenzaflow-bpm-release-parent; the signing key and the Central token are
# secrets of this repository, so the workflow is here.
#
# Without `publish`, the workflow builds and signs the POM and uploads nothing.
# With `publish`, it uploads the signed POM to the Central Portal and waits for the
# validation. The upload is not public then: someone publishes the deployment at
# https://central.sonatype.com/publishing/deployments. Maven Central is append-only, a
# published version can never be replaced or removed.
#
# The build of the release parent runs with the signing key and the Central token. So
# the workflow builds one commit, named by its full SHA: the commit that was reviewed,
# not whatever a branch points to when the workflow starts. The actions are pinned to a
# commit for the same reason.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit of cadenzaflow-bpm-release-parent to publish (full SHA, 40 characters)'
        type: string
        required: true
      publish:
        description: 'Upload to Maven Central (off = build and sign only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and upload
    # A GitHub-hosted runner: the build is one POM, and the signing key does not stay on
    # a machine that other jobs use.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check the commit input
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! printf '%s' "${COMMIT}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::The commit has to be a full SHA: 40 characters, 0-9 and a-f."
            exit 1
          fi

      - name: Checkout the release parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cadenzaflow/cadenzaflow-bpm-release-parent
          ref: ${{ inputs.commit }}
          # the whole history: the next step looks for the commit on the branches
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the commit is on a branch of the release parent
        run: |
          # GitHub also serves the commits of forks through the repository they were
          # forked from. Such a commit is on no branch of the repository itself.
          BRANCHES="$(git branch -r --contains HEAD)"
          if [ -z "${BRANCHES}" ]; then
            echo "::error::Commit $(git rev-parse HEAD) is on no branch of cadenzaflow-bpm-release-parent."
            exit 1
          fi
          echo "Commit $(git rev-parse HEAD) is on:"
          echo "${BRANCHES}"

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the version
        id: v
        run: |
          VERSION="$(mvn --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read the version of the POM."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release parent ${VERSION}"

          URL="https://repo1.maven.org/maven2/org/cadenzaflow/cadenzaflow-bpm-release-parent/${VERSION}/cadenzaflow-bpm-release-parent-${VERSION}.pom"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          echo "GET $URL -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "::error::Version ${VERSION} is on Maven Central already. Central is append-only: publish a new version."
            exit 1
          fi

      - name: Import the release signing key
        env:
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_KEY}" ]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY secret is missing."
            exit 1
          fi
          # The parent of the release parent pins maven-gpg-plugin 1.4, which cannot tell
          # gpg to take the passphrase without a terminal. gpg is configured directly.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'pinentry-mode loopback\nbatch\nno-tty\n' >> ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

          printf '%s' "${GPG_KEY}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long | sed -n '1,6p'

      - name: Write settings.xml
        run: |
          # The file holds no secret. Maven takes the Central token (server `central`,
          # read by the publishing plugin) and the passphrase of the signing key from the
          # environment of the build, so neither is in a file or on a command line.
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>signing</id>
                <properties>
                  <gpg.passphrase>${env.GPG_PASSPHRASE}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>signing</activeProfile>
            </activeProfiles>
          </settings>
          SETTINGS

      - name: Build and sign
        if: ${{ !inputs.publish }}
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::error::MAVEN_GPG_PASSPHRASE secret is missing."
            exit 1
          fi
          # sonatype-oss-release is a profile of the parent of the release parent: it
          # signs the POM. `verify` stops before the upload, and this step does not get
          # the Central token.
          mvn --batch-mode clean verify -Psonatype-oss-release
          find target -name "*.asc"

      - name: Build, sign and upload to Maven Central
        if: ${{ inputs.publish }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -z "${CENTRAL_TOKEN_USERNAME}" ] || [ -z "${CENTRAL_TOKEN_PASSWORD}" ] || [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::error::CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD or MAVEN_GPG_PASSPHRASE secret is missing."
            exit 1
          fi
          # The publishing plugin of the same profile uploads the signed POM and waits
          # until Central has validated it. The POM does not switch the automatic
          # publishing on, so nothing is public after this step.
          mvn --batch-mode clean deploy -Psonatype-oss-release

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.v.outputs.VERSION }}
          COMMIT: ${{ inputs.commit }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "## Release parent"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Upload to Maven Central: \`${PUBLISH}\`"
            echo "- Status: \`${{ job.status }}\`"
            if [ "${PUBLISH}" = "true" ]; then
              echo ""
              echo "The upload is not public yet. Publish the deployment at https://central.sonatype.com/publishing/deployments."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
