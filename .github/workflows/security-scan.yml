name: Security Scan

on:
  push:
    branches:
      - master
      - 'cadenzaflow-*.*.*'
  schedule:
    # Push-only triggers left the repo unscanned between releases, so CVEs
    # published in quiet periods never surfaced. Weekly rescan closes that gap.
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  APP_NAME: cadenzaflow-bpm-platform
  SMTP_SERVER: mail-eu.smtp2go.com
  SMTP_PORT: "2525"
  # Release lines the weekly scan covers: the newest release branch
  # (cadenzaflow-X.Y.Z) of every line listed here, plus master. Each one gets
  # its own report. Adding or dropping a line is a support decision.
  SCAN_LINES: "1.2 1.3"

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Choose what to scan
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A push or a manual run scans its own branch. A scheduled run always
          # runs on master, so it picks the release branches itself.
          if [ "$EVENT_NAME" = schedule ]; then
            branches="$(git ls-remote --heads "https://github.com/${REPOSITORY}.git" 'cadenzaflow-*' | sed 's#.*refs/heads/##')"
            refs=""
            for line in $SCAN_LINES; do
              newest="$(grep -E "^cadenzaflow-${line//./\\.}\.[0-9]+$" <<< "$branches" | sort -V | tail -n 1 || true)"
              if [ -z "$newest" ]; then
                echo "::error::No release branch for line ${line}"
                exit 1
              fi
              refs="${refs} ${newest}"
            done
            refs="${refs} master"
          else
            refs="${REF_NAME}"
          fi
          # The report names the release it is for: cadenzaflow-1.3.0 -> 1.3.0,
          # any other branch by its name.
          matrix="$(for ref in $refs; do
            jq -nc --arg ref "$ref" '{ref: $ref, label: ($ref | sub("^cadenzaflow-"; ""))}'
          done | jq -sc '{include: .}')"
          echo "Scanning: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  security-scan:
    name: security-scan (${{ matrix.label }})
    needs: targets
    runs-on: cadenzaflow-runner
    strategy:
      # One self-hosted runner: the releases are scanned one after the other,
      # and a failing release does not stop the others.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run scans the branch tips; a push scans the pushed commit.
          ref: ${{ github.event_name == 'schedule' && matrix.ref || github.sha }}
          fetch-depth: 0

      # The scripts and actions come from this run's commit (master for the
      # weekly run), so every release is scanned the same way, also a release
      # older than the scan tooling.
      - name: Check out the scan tooling
        uses: actions/checkout@v4
        with:
          path: .scan-tools
          sparse-checkout: .github

      - name: Describe the scanned source
        id: source
        env:
          REF: ${{ matrix.ref }}
        run: |
          source="${REF} @ $(git rev-parse --short=10 HEAD)"
          tag="$(git tag --points-at HEAD 'cadenzaflow-v*' | sort -V | tail -n 1)"
          if [ -n "$tag" ]; then
            source="${source}, released as ${tag}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${source}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-scan-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-scan-
            ${{ runner.os }}-maven-

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Purge cached CadenzaFlow artifacts (stale parent POMs poison resolution)
        run: |
          # See CADENZAFLOW_RELEASE.yml: Maven never re-downloads a RELEASE it
          # already has, so a parent POM changed after publication survives in
          # the cache forever. Ours are small - always take them fresh.
          rm -rf ~/.m2/repository/org/cadenzaflow
          echo "Purged ~/.m2/repository/org/cadenzaflow"

      - name: Pre-resolve Maven dependencies for Trivy
        run: |
          # Trivy resolves pom parent chains and dependency POMs itself; on a
          # cold runner that meant unauthenticated bursts to Maven Central,
          # which 429-rate-limits this runner's IP and makes Trivy exit FATAL
          # before writing a report (every scan since at least 2026-06-29 died
          # this way). With the local repo populated, Trivy never goes remote.
          # The script tolerates only reactor modules that are not released yet.
          bash .scan-tools/.github/scripts/pre-resolve-dependencies.sh

      - name: Trivy filesystem scan
        id: trivy_fs
        uses: ./.scan-tools/.github/actions/trivy-scan
        with:
          scan_type: fs
          scan_target: .
          severity: HIGH,CRITICAL
          output_file: trivy-fs-report.json
          # Production-scope policy (project_cadenzaflow_security_eol_policy.md,
          # same list as the 2026-05 release baselines): qa/* is test
          # infrastructure, engine-rest/docs is doc-gen npm tooling,
          # engine-spring/core is the documented Spring 5.3 EOL track (its
          # Spring 6 dual-track lives in engine-spring/core-6), and
          # webapps/frontend is the AngularJS line superseded by webapps/react.
          # None of these ships in the distros.
          # third-party/ holds build tooling that patches third-party jars (e.g. the
          # spring-webmvc backport); it depends on the unpatched input by design.
          # .scan-tools is the checkout of the scan tooling above.
          skip_dirs: .git,node_modules,target,.mvn,docs,test,src/test,qa,spring-boot-starter/starter-qa,spring-boot-starter-4/starter-qa,engine-spring/core,engine-rest/docs,engine-rest/engine-rest-openapi/target,webapps/frontend,third-party,.scan-tools
          skip_files: engine-spring/pom.xml
          # Per-CVE, path-scoped, expiring exceptions with a written statement;
          # each release has its own.
          ignore_file: .trivyignore.yaml

      - name: Generate security report and send mail
        # No `if: always()` here: when the scan step fails there is no report
        # file, and the counting fallbacks in security-report turn that into a
        # green "0 findings" PDF. A failed scan must stay a red workflow, not
        # become a clean-looking mail.
        uses: ./.scan-tools/.github/actions/security-report
        with:
          app_name: ${{ env.APP_NAME }}
          # The release the report is for. The version in pom.xml is no help:
          # the source tree keeps 1.2.0 on every branch, the release build sets
          # the real one.
          version: ${{ matrix.label }}
          source: ${{ steps.source.outputs.source }}
          environment: production
          trivy_repo_report: ''
          trivy_fs_report: ${{ steps.trivy_fs.outputs.report_path }}
          trivy_image_report: ''
          sonarqube_report: ''
          # Recipients are a secret: run logs of this public repository show
          # plain values, secrets are masked.
          mail_to: ${{ secrets.SECURITY_REPORT_MAIL_TO }}
          smtp_server: ${{ env.SMTP_SERVER }}
          smtp_port: ${{ env.SMTP_PORT }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
