name: Security Scan

on:
  push:
    branches:
      - master
      - 'cadenzaflow-*.*.*'
  schedule:
    # Push-only triggers left the repo unscanned between releases, so CVEs
    # published in quiet periods never surfaced. Weekly rescan closes that gap.
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  APP_NAME: cadenzaflow-bpm-platform
  MAIL_TO: ali.aras@pia-team.com,rahmani.saygin@pia-team.com
  SMTP_SERVER: mail-eu.smtp2go.com
  SMTP_PORT: "2525"

jobs:
  security-scan:
    runs-on: cadenzaflow-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve APP_VERSION from root pom.xml
        id: ver
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse('pom.xml').getroot()
          v = root.find('m:version', ns)
          print(v.text if v is not None else '')
          PY
          )
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read project version from pom.xml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected APP_VERSION: $VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-scan-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-scan-
            ${{ runner.os }}-maven-

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Purge cached CadenzaFlow artifacts (stale parent POMs poison resolution)
        run: |
          # See CADENZAFLOW_RELEASE.yml: Maven never re-downloads a RELEASE it
          # already has, so a parent POM changed after publication survives in
          # the cache forever. Ours are small - always take them fresh.
          rm -rf ~/.m2/repository/org/cadenzaflow
          echo "Purged ~/.m2/repository/org/cadenzaflow"

      - name: Pre-resolve Maven dependencies for Trivy
        run: |
          # Trivy resolves pom parent chains and dependency POMs itself; on a
          # cold runner that meant unauthenticated bursts to Maven Central,
          # which 429-rate-limits this runner's IP and makes Trivy exit FATAL
          # before writing a report (every scan since at least 2026-06-29 died
          # this way). With the local repo populated, Trivy never goes remote.
          ./mvnw -B -q -DskipTests dependency:resolve

      - name: Trivy filesystem scan
        id: trivy_fs
        uses: ./.github/actions/trivy-scan
        with:
          scan_type: fs
          scan_target: .
          severity: HIGH,CRITICAL
          output_file: trivy-fs-report.json
          # Production-scope policy (project_cadenzaflow_security_eol_policy.md,
          # same list as the 2026-05 release baselines): qa/* is test
          # infrastructure, engine-rest/docs is doc-gen npm tooling,
          # engine-spring/core is the documented Spring 5.3 EOL track (its
          # Spring 6 dual-track lives in engine-spring/core-6), and
          # webapps/frontend is the AngularJS line superseded by webapps/react.
          # None of these ships in the distros.
          skip_dirs: .git,node_modules,target,.mvn,docs,test,src/test,qa,spring-boot-starter/starter-qa,spring-boot-starter-4/starter-qa,engine-spring/core,engine-rest/docs,engine-rest/engine-rest-openapi/target,webapps/frontend
          skip_files: engine-spring/pom.xml

      - name: Generate security report and send mail
        # No `if: always()` here: when the scan step fails there is no report
        # file, and the counting fallbacks in security-report turn that into a
        # green "0 findings" PDF. A failed scan must stay a red workflow, not
        # become a clean-looking mail.
        uses: ./.github/actions/security-report
        with:
          app_name: ${{ env.APP_NAME }}
          version: ${{ steps.ver.outputs.version }}
          environment: production
          trivy_repo_report: ''
          trivy_fs_report: ${{ steps.trivy_fs.outputs.report_path }}
          trivy_image_report: ''
          sonarqube_report: ''
          mail_to: ${{ env.MAIL_TO }}
          smtp_server: ${{ env.SMTP_SERVER }}
          smtp_port: ${{ env.SMTP_PORT }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
