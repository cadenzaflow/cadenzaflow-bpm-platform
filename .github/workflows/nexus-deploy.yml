name: Nexus Deploy

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests during deploy'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      maven_args:
        description: 'Extra Maven arguments (appended)'
        required: false
        default: ''
        type: string
      projects:
        description: 'Deploy only these modules (-pl), e.g. engine-spring/core-7,spring-boot-starter-4/starter. Empty = whole reactor minus heavy qa ITs.'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'cadenzaflow-v*'

concurrency:
  group: nexus-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  TZ: Europe/Berlin
  NEXUS_REPO_ID: cadenzaflow-nexus
  NEXUS_URL: https://nexus.cadenzaflow.com/repository/cadenzaflow-nexus

jobs:
  deploy:
    name: Maven deploy to CadenzaFlow Nexus
    runs-on: cadenzaflow-runner
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-deploy-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-deploy-
            ${{ runner.os }}-maven-

      - name: Configure Maven settings.xml
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "${NEXUS_USERNAME}" ] || [ -z "${NEXUS_PASSWORD}" ]; then
            echo "::error::NEXUS_USERNAME or NEXUS_PASSWORD secret is missing."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>cadenzaflow-nexus</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
              <server>
                <id>cadenzaflow-nexus-alt</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
              <!-- Inert stub - see CADENZAFLOW_RELEASE.yml: the release parent
                   injects Sonatype's central-publishing plugin, which NPEs
                   without a `central` server even though we skip it below. -->
              <server>
                <id>central</id>
                <username>not-used-we-publish-to-nexus</username>
                <password>not-used-we-publish-to-nexus</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Purge cached CadenzaFlow artifacts (stale parent POMs poison the build)
        run: |
          # See CADENZAFLOW_RELEASE.yml: Maven never re-downloads a RELEASE it
          # already has, so a parent POM changed after publication survives in
          # the runner cache forever. Ours are small - always take them fresh.
          rm -rf ~/.m2/repository/org/cadenzaflow
          echo "Purged ~/.m2/repository/org/cadenzaflow"

      - name: Show project version
        run: ./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout && echo

      - name: Maven deploy
        env:
          SKIP_TESTS: ${{ inputs.skip_tests || 'true' }}
          EXTRA_ARGS: ${{ inputs.maven_args || '' }}
          PROJECTS: ${{ inputs.projects || '' }}
          # settings.xml resolves ${env.NEXUS_*} when MAVEN runs, so the
          # secrets must be in THIS step's env - not only in the step that
          # wrote the file. Without them the PUT goes out anonymous (401).
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          SKIP_FLAG=""
          if [ "${SKIP_TESTS}" = "true" ]; then
            SKIP_FLAG="-DskipTests -DskipITs"
          fi

          # Default: whole reactor minus the heavy qa ITs. If `projects` is set,
          # deploy only those modules (e.g. a narrow library release). Note: a
          # narrow -pl can't also carry the qa exclusions (Maven merges multiple
          # -pl and the excluded paths aren't in the selected reactor), so the
          # two are mutually exclusive by design.
          PL="${PROJECTS:-!qa/integration-tests-engine,!qa/integration-tests-engine-jakarta,!qa/integration-tests-webapps,!qa/test-db-instance-migration,!qa/test-db-rolling-update,!qa/test-old-engine,!qa/large-data-tests,!qa/performance-tests-engine,!qa/tomcat-runtime,!qa/tomcat9-runtime,!qa/wildfly-runtime,!qa/wildfly26-runtime}"

          # WARNING - narrow deploys publish INCONSISTENT releases.
          # A -pl selection deploys only those modules; the parent POMs on
          # Nexus keep whatever content they had. If a module's POM references
          # a property that was added to the parent after the parents were
          # published, the released artifact is unresolvable for everyone
          # outside this repo. That is exactly what happened to the 1.2.0
          # spring-boot-starter-4 family (${version.spring.framework7} is used
          # by cadenzaflow-bpm-spring-boot-4-starter-root:1.2.0 but defined in
          # no published parent). Prefer a full-reactor deploy for releases.
          if [ -n "${PROJECTS}" ]; then
            echo "::warning::Narrow deploy (-pl ${PROJECTS}): parent POMs are NOT redeployed. Verify the published POM chain resolves from a clean repository before announcing this release."
          fi

          # maven-deploy-plugin 3.x syntax is "id::url" (two segments). The
          # legacy "id::default::url" form parses the server id as
          # "id::default", so the settings.xml credentials never match and the
          # upload goes out anonymous -> Nexus 401.
          ./mvnw deploy \
            --batch-mode \
            --fail-at-end \
            --threads 1C \
            -Dskip.central.release=true \
            -DaltDeploymentRepository="${NEXUS_REPO_ID}::${NEXUS_URL}" \
            ${SKIP_FLAG} \
            -pl "${PL}" \
            ${EXTRA_ARGS}

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Nexus Deploy Result"
            echo ""
            echo "- Repository: \`${NEXUS_URL}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Skip tests: \`${{ inputs.skip_tests || 'true' }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
