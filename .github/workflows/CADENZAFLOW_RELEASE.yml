name: CADENZAFLOW_RELEASE

# Release pipeline for cadenzaflow-bpm-platform.
#
# Trigger: push a tag `cadenzaflow-v<version>` (e.g. cadenzaflow-v1.2.1),
#          or run manually (workflow_dispatch) with the version.
#
# What it does, for that version:
#   1. Align the reactor version to the tag (versions:set).
#   2. Build the full platform (default 'distro' profile) — Tomcat + Run distros
#      and deploy the Maven artifacts (engine, engine-spring-7, webapps,
#      starters, ...) to the CadenzaFlow Nexus.
#   3. Create a GitHub Release for the tag and attach the four distro files:
#        cadenzaflow-bpm-tomcat-<version>.{zip,tar.gz}
#        cadenzaflow-bpm-run-<version>.{zip,tar.gz}
#   4. (Optional) Notify downloads.cadenzaflow.com: POST a repository_dispatch
#      (event_type: cadenzaflow-release-published) to cadenzaflow-download so
#      its PUBLISH workflow rolls the release onto the download portal.
#
# Relationship to the other workflows:
#   - nexus-deploy.yml is an ad-hoc Maven deploy; THIS workflow is the
#     tag-driven, full release (Maven artifacts + distros + GitHub Release).
#   - cadenzaflow-download/PUBLISH.yml consumes the GitHub Release created here.
#
# Secrets:
#   NEXUS_USERNAME / NEXUS_PASSWORD     - Maven deploy to Nexus (same as nexus-deploy.yml)
#   DOWNLOAD_DISPATCH_TOKEN (optional)  - cross-repo PAT / GitHub App token used to
#                                         trigger the download publish. If absent,
#                                         step 4 is skipped and the run prints the
#                                         inputs to launch PUBLISH.yml manually.
#
# NOTE: this workflow has not been executed yet. On the first real run, validate
# the Maven invocation (versions:set scope, the default profile, the qa
# exclusions) and the distro output names against an actual build.

on:
  push:
    tags:
      - 'cadenzaflow-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0'
        required: true
      ref:
        description: 'Git ref (tag/branch) to build from; defaults to the version tag (e.g. 1.2.0)'
        required: false
        default: ''
      deploy_to_nexus:
        description: 'Also deploy Maven artifacts to Nexus (leave OFF for an already-published version like 1.2.0)'
        type: boolean
        default: false
      notify_download:
        description: 'Trigger the downloads.cadenzaflow.com publish'
        type: boolean
        default: true
      build_distros:
        description: 'Build the Tomcat/Run distributions (OFF publishes only the Maven artifacts - much lighter on the runner)'
        type: boolean
        default: true
      publish_to_central:
        description: 'ALSO publish to Maven Central (irreversible - a published version can never be replaced)'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  MAVEN_OPTS: "-Xmx4g -XX:+UseG1GC -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  TZ: Europe/Berlin
  NEXUS_REPO_ID: cadenzaflow-nexus
  NEXUS_URL: https://nexus.cadenzaflow.com/repository/cadenzaflow-nexus

concurrency:
  group: cadenzaflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, deploy & publish GitHub Release
    runs-on: cadenzaflow-runner
    timeout-minutes: 240
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
      tag: ${{ steps.v.outputs.TAG }}
      minor: ${{ steps.v.outputs.MINOR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push: the pushed tag. dispatch: explicit ref, else the version tag.
          ref: ${{ github.event.inputs.ref || github.event.inputs.version || github.ref }}

      - name: Resolve version & tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="cadenzaflow-v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#cadenzaflow-v}"
          fi
          MINOR="$(echo "$VERSION" | cut -d. -f1-2)"   # 1.2.1 -> 1.2 (config.json version key)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG"         >> "$GITHUB_OUTPUT"
          echo "MINOR=$MINOR"     >> "$GITHUB_OUTPUT"
          echo "Releasing version=$VERSION tag=$TAG (config.json key $MINOR)"

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-release-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-release-
            ${{ runner.os }}-maven-

      - name: Configure Maven settings.xml (Nexus credentials)
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_nexus == 'true' }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "${NEXUS_USERNAME}" ] || [ -z "${NEXUS_PASSWORD}" ]; then
            echo "::error::NEXUS_USERNAME or NEXUS_PASSWORD secret is missing."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>cadenzaflow-nexus</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
              <!-- Inert stub. The release parent injects Sonatype's
                   central-publishing plugin (execution id
                   injected-central-publishing), which resolves a server with
                   id `central` and NPEs when it is absent. We publish to the
                   CadenzaFlow Nexus, not to Maven Central, and the plugin is
                   skipped below - these credentials are never used. -->
              <server>
                <id>central</id>
                <username>not-used-we-publish-to-nexus</username>
                <password>not-used-we-publish-to-nexus</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Purge cached CadenzaFlow artifacts (stale parent POMs poison the build)
        run: |
          # The Maven cache is restored across runs, and Maven never re-downloads
          # a RELEASE artifact it already has. A parent POM that changed after
          # publication therefore sticks around forever on the runner. That is
          # not hypothetical: the cached cadenzaflow-release-parent:1.0.0 still
          # activates Sonatype's Central publishing plugin, while the POM
          # actually published on Nexus has it commented out ("disabled for
          # Nexus-only deployment"). Our own artifacts are small - always take
          # them fresh.
          rm -rf ~/.m2/repository/org/cadenzaflow
          echo "Purged ~/.m2/repository/org/cadenzaflow"

      - name: Align reactor version to the release tag
        run: |
          # No -P: the default activeByDefault 'distro' profile is the full reactor.
          ./mvnw -q versions:set \
            -DnewVersion="${{ steps.v.outputs.VERSION }}" \
            -DprocessAllModules -DgenerateBackupPoms=false

      - name: Build platform + distros (+ optional Nexus deploy)
        env:
          # settings.xml references ${env.NEXUS_*}, which Maven resolves when IT
          # runs - so the secrets must be on THIS step, not only on the step
          # that wrote the file. Otherwise the deploy goes out anonymous (401).
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          # Full build via the default 'distro' profile — engine, engine-spring-7,
          # webapps, rest, the -4 starters AND the tomcat/run distros. Same default
          # reactor as nexus-deploy.yml (no -P); -Pdistro-ce alone omits engine-spring
          # and the BOM, so engine-spring-7's managed version can't resolve.
          # push tag = full release (deploy); workflow_dispatch honours deploy_to_nexus
          # (OFF by default, so republishing an existing version skips Nexus).
          GOAL="install"; ALT=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.deploy_to_nexus }}" = "true" ]; then
            GOAL="deploy"
            # THREE segments, because this build pins maven-deploy-plugin
            # 2.8.2, which requires "id::layout::url" and rejects anything
            # else with "Invalid syntax for alternative repository".
            # (Deploy-plugin 3.x wants the two-segment "id::url" instead - as
            # used in cadenzaflow-keycloak. Check the plugin version before
            # copying this line between repositories.)
            ALT="-DaltDeploymentRepository=${NEXUS_REPO_ID}::default::${NEXUS_URL}"
          fi
          # Assembling the distributions is by far the heaviest part of this
          # build and has twice killed the self-hosted runner ("lost
          # communication with the server"). Publishing only the Maven
          # artifacts is a much lighter job - and it is what unblocks
          # consumers, since the distros only feed the download portal.
          DISTRO_EXCLUDES=""
          if [ "${{ github.event.inputs.build_distros }}" = "false" ]; then
            DISTRO_EXCLUDES=",!distro/tomcat,!distro/run"
            echo "Distributions are OFF: publishing Maven artifacts only."
          fi

          # Measured 2026-07-27 with a temporary probe: at peak this build used
          # 17 GB of the 50 GB disk and 11 GB of 30 GB RAM - so the runner
          # deaths were NOT resource exhaustion. With a warm Maven cache the
          # full build including both distributions finishes in under six
          # minutes; the failures happened on long cold-cache runs.
          echo "Maven goal: clean ${GOAL}"
          # skip.central.release: belt and braces. The release parent published
          # on Nexus has the Central publishing plugin commented out, but older
          # variants of that POM bind the plugin's skip flag to this property.
          # (Note: -DskipPublishing does NOT work - those variants configure the
          # parameter in the POM, and POM configuration beats a CLI property.)
          # This release goes to the CadenzaFlow Nexus; publishing to Maven
          # Central is a separate process that is not set up yet.
          # --threads 2, not 1C: at 1C (8 threads on this runner) the release
          # build starves the self-hosted runner and it loses contact with
          # GitHub ("The self-hosted runner lost communication with the
          # server") about 30 minutes in. test.yml survives 1C because it does
          # not assemble the distributions; this build does, concurrently.
          # The job has a 240-minute budget, so trading parallelism for
          # survivability is the right call here.
          ./mvnw clean "${GOAL}" \
            --batch-mode --fail-at-end --threads 2 \
            -DskipTests -DskipITs \
            -Dskip.central.release=true \
            -Dmaven.deploy.skip=false \
            ${ALT} \
            -pl "!qa/integration-tests-engine,!qa/integration-tests-engine-jakarta,!qa/integration-tests-webapps,!qa/test-db-instance-migration,!qa/test-db-rolling-update,!qa/test-old-engine,!qa/large-data-tests,!qa/performance-tests-engine,!qa/tomcat-runtime,!qa/tomcat9-runtime,!qa/wildfly-runtime,!qa/wildfly26-runtime${DISTRO_EXCLUDES}"

      - name: Verify the artifacts really reached Nexus
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_nexus == 'true' }}
        run: |
          # A release that deploys NOTHING must not report success. That is not
          # theoretical: the central-publishing extension in the release parent
          # replaces maven-deploy-plugin, so skipping the Central publish left
          # `mvn deploy` doing nothing at all - BUILD SUCCESS, empty Nexus.
          VERSION="${{ steps.v.outputs.VERSION }}"
          URL="${NEXUS_URL}/org/cadenzaflow/bpm/cadenzaflow-engine/${VERSION}/cadenzaflow-engine-${VERSION}.pom"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          echo "GET $URL -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Nothing was published: cadenzaflow-engine ${VERSION} is not on Nexus."
            exit 1
          fi
          echo "Confirmed: cadenzaflow-engine ${VERSION} is on Nexus."

      - name: Collect distribution assets
        if: ${{ github.event.inputs.build_distros != 'false' }}
        run: |
          VERSION="${{ steps.v.outputs.VERSION }}"
          mkdir -p release-assets
          for f in \
            "distro/tomcat/distro/target/cadenzaflow-bpm-tomcat-${VERSION}.zip" \
            "distro/tomcat/distro/target/cadenzaflow-bpm-tomcat-${VERSION}.tar.gz" \
            "distro/run/distro/target/cadenzaflow-bpm-run-${VERSION}.zip" \
            "distro/run/distro/target/cadenzaflow-bpm-run-${VERSION}.tar.gz" ; do
            if [ -f "$f" ]; then cp "$f" release-assets/; else echo "::warning::missing $f"; fi
          done
          echo "Collected:"; ls -la release-assets
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No distro assets found for version ${VERSION}."
            exit 1
          fi

      - name: Create / publish GitHub Release with assets
        if: ${{ github.event.inputs.build_distros != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # REST, not the gh CLI: this self-hosted runner image does not ship
          # gh ("gh: command not found"), unlike GitHub-hosted runners. curl is
          # present and the job token is enough for both calls.
          set -euo pipefail
          TAG="${{ steps.v.outputs.TAG }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          rel_id() { grep -m1 -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | grep -o '[0-9]*'; }

          ID="$(curl -sS -H "$AUTH" "$API/releases/tags/$TAG" | rel_id || true)"
          if [ -z "${ID:-}" ]; then
            echo "Creating release $TAG"
            ID="$(curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"generate_release_notes\":true}" \
              "$API/releases" | rel_id)"
          else
            echo "Reusing release $TAG (id $ID)"
          fi
          [ -n "$ID" ] || { echo "::error::Could not create or find release $TAG"; exit 1; }

          for f in release-assets/*; do
            NAME="$(basename "$f")"
            # delete an existing asset of the same name (re-runs must be idempotent)
            OLD="$(curl -sS -H "$AUTH" "$API/releases/$ID/assets" \
                   | tr ',' '\n' | grep -B2 "\"name\":\"$NAME\"" | rel_id || true)"
            [ -n "${OLD:-}" ] && curl -sS -X DELETE -H "$AUTH" "$API/releases/assets/$OLD" >/dev/null || true
            CODE="$(curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/octet-stream' \
              --data-binary @"$f" -o /dev/null -w '%{http_code}' \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$ID/assets?name=$NAME")"
            echo "uploaded $NAME -> $CODE"
            [ "$CODE" = "201" ] || { echo "::error::Upload of $NAME failed ($CODE)"; exit 1; }
          done

      # ---------------------------------------------------------------------
      # Optional second pass: Maven Central.
      #
      # Deliberately a SEPARATE Maven run from the Nexus deploy above, because
      # the two need opposite settings - which is also how 1.0.0/1.1.0 were
      # published by hand:
      #   mvn -Psonatype-oss-release -Dskip.cadenzaflow.release=true ... deploy
      #
      # -Psonatype-oss-release is a profile in the published release parent and
      # brings exactly what Central requires: sources jar, javadoc jar, GPG
      # signatures and the central-publishing plugin. Nothing needs to be added
      # to our own POMs.
      #
      # Central is APPEND-ONLY: a published version can never be replaced or
      # removed. Hence the explicit opt-in input, off by default.
      # ---------------------------------------------------------------------
      - name: Import the release signing key
        if: ${{ github.event.inputs.publish_to_central == 'true' }}
        env:
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_KEY}" ]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY secret is missing."
            exit 1
          fi
          printf '%s' "${GPG_KEY}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long | sed -n '1,6p'

      - name: Add the Central Portal credentials to settings.xml
        if: ${{ github.event.inputs.publish_to_central == 'true' }}
        env:
          CENTRAL_USR: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PSW: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          if [ -z "${CENTRAL_USR}" ] || [ -z "${CENTRAL_PSW}" ]; then
            echo "::error::CENTRAL_TOKEN_USERNAME or CENTRAL_TOKEN_PASSWORD secret is missing."
            exit 1
          fi
          # Rewrite settings.xml for this pass: the Nexus-only run wrote an
          # inert `central` placeholder, which must now carry the real token.
          # The publishing plugin resolves the server id `central` (tokenAuth).
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>cadenzaflow-nexus</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "settings.xml rewritten with the central server entry"

      - name: Publish to Maven Central
        if: ${{ github.event.inputs.publish_to_central == 'true' }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # skip.cadenzaflow.release=true: Central pass only, do not re-deploy
          # to Nexus (that already happened above).
          # Distro modules are excluded: Central takes libraries, not the
          # Tomcat/Run archives - and javadoc for the whole reactor is heavy.
          ./mvnw clean deploy \
            --batch-mode --threads 2 \
            -Psonatype-oss-release \
            -Dskip.cadenzaflow.release=true \
            -DskipTests -DskipITs \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -Dgpg.args="--pinentry-mode=loopback --batch --yes" \
            -DautoPublish=false \
            -DwaitUntil=validated \
            -pl '!qa/integration-tests-engine,!qa/integration-tests-engine-jakarta,!qa/integration-tests-webapps,!qa/test-db-instance-migration,!qa/test-db-rolling-update,!qa/test-old-engine,!qa/large-data-tests,!qa/performance-tests-engine,!qa/tomcat-runtime,!qa/tomcat9-runtime,!qa/wildfly-runtime,!qa/wildfly26-runtime,!distro/tomcat,!distro/run'

      - name: Verify the version reached Maven Central
        if: ${{ github.event.inputs.publish_to_central == 'true' }}
        run: |
          # Central indexing is not instant; this is a best-effort check.
          VERSION="${{ steps.v.outputs.VERSION }}"
          URL="https://repo1.maven.org/maven2/org/cadenzaflow/bpm/cadenzaflow-engine/${VERSION}/cadenzaflow-engine-${VERSION}.pom"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          echo "GET $URL -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Not visible on Central yet. Publishing is asynchronous - check https://central.sonatype.com/publishing/deployments before re-running."
          fi

      - name: Release summary
        if: always()
        run: |
          {
            echo "## CadenzaFlow Release"
            echo ""
            echo "- Version: \`${{ steps.v.outputs.VERSION }}\`"
            echo "- Tag: \`${{ steps.v.outputs.TAG }}\`"
            echo "- Nexus: \`${NEXUS_URL}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify_download:
    name: Trigger downloads.cadenzaflow.com publish
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.notify_download == 'true' }}
    steps:
      # PUBLISH.yml is invoked once per package. It currently downloads ALL release
      # assets per call, so tomcat and run files land in both package folders — a
      # known limitation of cadenzaflow-download/PUBLISH.yml to tighten later
      # (filter assets by package name).
      - name: Dispatch cadenzaflow-release-published (tomcat + run)
        env:
          DISPATCH_TOKEN: ${{ secrets.DOWNLOAD_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::warning::DOWNLOAD_DISPATCH_TOKEN not set — skipping auto-publish."
            echo "Run cadenzaflow-download › PUBLISH manually with:"
            echo "  source_repo=${{ github.repository }}"
            echo "  release_tag=${{ needs.release.outputs.tag }}"
            echo "  package=cadenzaflow-bpm-tomcat | cadenzaflow-bpm-run"
            echo "  package_version=${{ needs.release.outputs.minor }}"
            exit 0
          fi
          for PKG in cadenzaflow-bpm-tomcat cadenzaflow-bpm-run; do
            echo "Dispatching publish for ${PKG} ..."
            curl -sS --fail -X POST \
              -H "Authorization: token ${DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/cadenzaflow/cadenzaflow-download/dispatches" \
              -d "{\"event_type\":\"cadenzaflow-release-published\",\"client_payload\":{\"source_repo\":\"${{ github.repository }}\",\"release_tag\":\"${{ needs.release.outputs.tag }}\",\"package\":\"${PKG}\",\"package_version\":\"${{ needs.release.outputs.minor }}\"}}"
          done
